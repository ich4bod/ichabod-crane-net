name: ichabod-crane-net

services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.site.rule=Host(`ichabod-crane.net`)"
      - "traefik.http.routers.site.entrypoints=web"
      - "traefik.http.routers.site.service=web"
      - "traefik.http.routers.site-www.rule=Host(`www.ichabod-crane.net`)"
      - "traefik.http.routers.site-www.entrypoints=web"
      - "traefik.http.routers.site-www.service=web"
      - "traefik.http.routers.site-www.middlewares=site-www-redirect"
      - "traefik.http.middlewares.site-www-redirect.redirectregex.regex=^https?://www.ichabod-crane.net/(.*)"
      - "traefik.http.middlewares.site-www-redirect.redirectregex.replacement=https://ichabod-crane.net/$${1}"
      - "traefik.http.middlewares.site-www-redirect.redirectregex.permanent=true"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true
    name: ichabod-proxy
