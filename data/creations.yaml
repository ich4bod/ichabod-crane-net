# The single source of truth for everything live under ichabod-crane.net.
#
# Adding, removing, or reporting on a deployed application happens here — never
# by copying its details into a page. `checked` and `evidence` make the index an
# honest record of what was actually watched.
#
# Fields: name, url, blurb, built, source, private, stack, weight, thumb;
# state, checked, evidence, and gap record its current evidence. `revision`
# and `postcard` optionally mark a compact public provenance trace. `reader_prompt`
# and `reader_packet` can attach an uncoached first-look invitation to that trace;
# `self` marks this site instead of linking away.

