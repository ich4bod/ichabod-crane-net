<section id="constraint-triangle">
  <h3>A triangle that answers back</h3>
  <svg viewBox="0 0 320 320" width="100%" aria-hidden="true">
    <polygon id="triangle-shape" points="100,280 220,280 160,160" fill="#e9755c"></polygon>
    <polygon id="triangle-memory-shape" hidden points="100,280 220,280 160,160" fill="none" stroke="#283346" stroke-width="2" stroke-dasharray="5 4"></polygon>
  </svg>
  <label for="triangle-base">Base width</label>
  <input id="triangle-base" type="range" min="60" max="240" step="10" value="120">
  <label for="triangle-height">Height without the area constraint</label>
  <input id="triangle-height" type="range" min="30" max="240" step="1" value="120" disabled>
  <label class="triangle-keep-row" for="triangle-keep"><input id="triangle-keep" type="checkbox" checked>Keep the area</label>
  <p id="triangle-values">Base: 120 · height: 120.0 · area: 7200.</p>
  <p id="triangle-equation">Area = base × height ÷ 2. When area stays at 7,200, widening the base lowers the top.</p>
  <p id="triangle-height-help">Unlock the area to move the height on its own. Locking again brings the area back to 7,200.</p>
  <div class="triangle-actions">
    <button id="triangle-reset" type="button">Reset triangle</button>
    <button id="triangle-undo" type="button">Undo triangle</button>
  </div>
  <div class="triangle-memory-actions">
    <button id="triangle-remember" type="button">Keep this triangle</button>
    <button id="triangle-return" type="button" disabled>Return to kept triangle</button>
    <button id="triangle-forget" type="button" disabled>Forget kept triangle</button>
  </div>
  <p id="triangle-memory-values">No triangle kept.</p>
</section>
<style>

    font: 22px/1.3 Georgia, serif;
  }
  #constraint-triangle svg {
    display: block;
    width: 100%;
    max-height: 320px;
  }
  #constraint-triangle label[for="triangle-base"] {
    display: block;
  }
  #triangle-base,
  #triangle-height {
    display: block;
    box-sizing: border-box;
    width: 100%;
    min-height: 44px;
    margin: 0;
  }
  #constraint-triangle .triangle-keep-row {
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 8px;

  #triangle-keep {
    width: 20px;

  }

    margin: 8px 0;
  }
  #constraint-triangle .triangle-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  #triangle-reset,
  #triangle-undo,
  #triangle-remember,
  #triangle-return,
  #triangle-forget {
    min-height: 44px;

    border-radius: 8px;
    padding: 8px 12px;
    background: #fff7e7;
    color: #283346;
    font: inherit;
    cursor: pointer;
  }
  #triangle-reset:disabled,
  #triangle-undo:disabled,
  #triangle-return:disabled,
  #triangle-forget:disabled {
    opacity: .45;
  }
  #constraint-triangle .triangle-memory-actions {
    display: flex;

  }
  #triangle-memory-shape[hidden] {

  }
</style>
