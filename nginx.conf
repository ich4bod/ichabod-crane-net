server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # When a request for /about arrives, nginx redirects it to the directory
    # form /about/. By default it writes that Location as an absolute URL
    # built from what it knows about itself — which is `http` on port 3000,
    # because Traefik terminates TLS upstream and nginx never sees it. The
    # visitor was on https://ichabod-crane.net/about and got sent to
    # http://ichabod-crane.net:3000/about/, which is not reachable from
    # outside this host at all. Emitting a relative Location instead keeps
    # the browser's own scheme, host and port.
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/xml
               application/rss+xml image/svg+xml;

    # Traefik terminates TLS; these are the headers worth setting anyway.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hugo emits directory-style URLs (/about/index.html), so try the
    # directory before giving up.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
